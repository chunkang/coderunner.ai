# Python-specific Quality Rules

id: use-fstring
language: python
severity: info
message: "Consider using f-strings for string formatting"
rule:
  any:
    # Single-quoted: the pattern itself begins with a double quote, so an
    # unquoted scalar ends at that quote and leaves `.format(...)` as garbage.
    - pattern: '"$$$STR".format($$$ARGS)'
    - pattern: '"$$$STR" % $ARGS'

---
id: use-pathlib
language: python
severity: info
message: "Consider using pathlib for file path operations"
rule:
  any:
    - pattern: os.path.join($$$ARGS)
    - pattern: os.path.exists($PATH)
    - pattern: os.path.isfile($PATH)
    - pattern: os.path.isdir($PATH)

---
id: use-context-manager
language: python
severity: warning
message: "Use context manager (with statement) for file operations"
rule:
  # Same single-node constraint. Rather than require the open/close pair to be
  # adjacent, flag any `open()` assignment that is not already inside a `with`.
  # The `fix:` is dropped: the rewrite depended on the three-statement shape and
  # cannot be derived from this single node.
  pattern: $FILE = open($$$ARGS)
  not:
    inside:
      kind: with_statement
      stopBy: end

---
id: bare-except
language: python
severity: warning
message: "Avoid bare except clauses. Catch specific exceptions."
rule:
  # A bare `except` clause is not a standalone program; `context` supplies the
  # `try` so it parses, and `selector` narrows the match back to the clause.
  # Verified not to match `except ValueError:` or `except E as e:`.
  pattern:
    context: |
      try:
          pass
      except:
          pass
    selector: except_clause

---
id: mutable-default-argument
language: python
severity: warning
message: "Mutable default argument. Use None and initialize inside function."
rule:
  any:
    - pattern: "def $FUNC($$$ARGS, $PARAM=[], $$$REST):"
    - pattern: "def $FUNC($$$ARGS, $PARAM={}, $$$REST):"

---
id: type-comparison
language: python
severity: warning
message: "Use isinstance() instead of type comparison"
rule:
  pattern: type($OBJ) == $TYPE
fix: isinstance($OBJ, $TYPE)

---
id: dict-get-default
language: python
severity: info
message: "Use dict.get() with default instead of conditional"
rule:
  pattern: |
    if $KEY in $DICT:
        $VAR = $DICT[$KEY]
    else:
        $VAR = $DEFAULT
fix: $VAR = $DICT.get($KEY, $DEFAULT)

---
id: list-comprehension-opportunity
language: python
severity: info
message: "Consider using list comprehension"
rule:
  # A pattern matches ONE AST node, so the original three-statement form
  # (`$RESULT = []` + for + append) could never parse. Match the loop itself and
  # require an append inside it; the preceding empty-list assignment is not what
  # makes the loop replaceable.
  kind: for_statement
  has:
    stopBy: end
    pattern: $RESULT.append($EXPR)

---
id: use-enumerate
language: python
severity: info
message: "Use enumerate() instead of manual index tracking"
rule:
  # Same single-node constraint as above. The manual counter increment inside
  # the loop is the signal; the `$IDX = 0` before it is not required to spot it.
  kind: for_statement
  has:
    stopBy: end
    pattern: $IDX += 1
