# AST-Grep Configuration for MoAI-ADK
# https://ast-grep.github.io/reference/sgconfig.html

ruleDirs:
  - security
  - quality
  - languages

# ast-grep expects a list of TestConfig STRUCTS here, not a list of globs. A bare
# string is rejected at config load with "invalid type: string ... expected
# struct TestConfig", which aborts the whole scan before a single file is read —
# so every rule below was unreachable. Verified against ast-grep 0.45.3,
# 2026-08-31. There is no __tests__ directory in this skill, so the key is
# removed rather than given a struct that would point at nothing.

languageGlobs:
  python:
    - "**/*.py"
    - "**/*.pyi"
  javascript:
    - "**/*.js"
    - "**/*.jsx"
    - "**/*.mjs"
    - "**/*.cjs"
  typescript:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.mts"
    - "**/*.cts"
  go:
    - "**/*.go"
  rust:
    - "**/*.rs"
  java:
    - "**/*.java"
  kotlin:
    - "**/*.kt"
    - "**/*.kts"
  cpp:
    - "**/*.c"
    - "**/*.cpp"
    - "**/*.cc"
    - "**/*.h"
    - "**/*.hpp"
  ruby:
    - "**/*.rb"
  php:
    - "**/*.php"

# Custom rules utilities
utils:
  is-security-sensitive:
    any:
      - pattern: password
      - pattern: secret
      - pattern: api_key
      - pattern: token
      - pattern: credential
