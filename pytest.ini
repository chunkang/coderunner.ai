# ==============================================================================
#  CodeRunner.AI  ::  pytest configuration  (SPEC-MEMORY-001, task T1)
# ------------------------------------------------------------------------------
#  Author  : Chun Kang <ck@strpy.com>
#
#  HOW TO RUN — IN-CONTAINER (this is the supported runtime; see acceptance.md
#  "Testability constraints"). The image carries rich/ollama/httpx but never
#  carries `tests/`, so the repository is bind-mounted over /work. This is
#  permanent, not a workaround for the T12 source copy:
#
#    docker run --rm -v "$PWD":/work -w /work --entrypoint sh \
#      coderunner-ai:latest -c \
#      'pip install --user -q pytest pytest-cov "pymilvus[milvus_lite]" && \
#       python -m pytest'
#
#  The memory.py suite alone additionally runs on a bare interpreter with
#  nothing but pytest — no rich, no ollama, no httpx, no Docker, no network:
#
#    python -m pytest --no-cov tests/test_memory_primitives.py \
#      tests/test_memory_recall_block.py tests/test_source_seam.py \
#      tests/test_keychain.py tests/test_launcher_source.py
#
#  The last two join that list for the same reason: keychain.py is a stdlib-only
#  leaf, and tests/test_launcher_source.py reads the launcher as text and shells
#  out to `bash -n`. Neither imports the application.
#
#  COVERAGE GATE — acceptance.md requires 100% on memory.py, 100% on recall.py
#  and >= 85% on vectorstore.py, each *separately*. SPEC-INPUT-001 adds params.py
#  and settings.py at 100%; SPEC-KEYCHAIN-001 adds keychain.py at 100%.
#  `--cov-fail-under` below
#  only enforces the COMBINED total, which a lopsided split would slip past. The per-file gate is enforced
#  by the `pytest_sessionfinish` hook in conftest.py, and is also reproducible
#  by hand after any run that wrote .coverage:
#
#    python -m coverage report --include=memory.py --fail-under=100
#    python -m coverage report --include=recall.py --fail-under=100
#    python -m coverage report --include=vectorstore.py --fail-under=85
#    python -m coverage report --include=params.py --fail-under=100
#    python -m coverage report --include=settings.py --fail-under=100
#    python -m coverage report --include=keychain.py --fail-under=100
#
#  ADDING A GATED MODULE TAKES TWO EDITS AND FORGETTING ONE FAILS LOUDLY. A
#  module named in conftest.py's PER_FILE_COVERAGE_TARGETS but absent from the
#  --cov list above is not measured at all: `cov.report(include=[...])` raises,
#  conftest.py:221-223 records "coverage unavailable", and the session fails.
#  That is the right direction for this mistake to fail in.
# ==============================================================================

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --cov=memory
    --cov=recall
    --cov=vectorstore
    --cov=params
    --cov=settings
    --cov=keychain
    --cov-report=term-missing
    --cov-fail-under=85
